version: "2"
sql:
  - engine: "postgresql"
    queries: "db/query/"
    schema: "migrations/"
    gen:
      go:
        package: "db"
        out: "db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_interface: false
        emit_exact_table_names: false
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
